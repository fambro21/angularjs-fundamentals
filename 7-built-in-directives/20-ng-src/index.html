<!doctype html>
<html lang="en" ng-app="NgSrcApp">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NgSrc</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.2.6/angular.js"></script>
  </head>
  <body>
    <h1>Wrong Way</h1>
    <img src="{{imgSrc}}" />

    <h1>Right way</h1>
    <img ng-src="{{imgSrc}}" />
    <script src="./app.js"></script>
  </body>
</html>
